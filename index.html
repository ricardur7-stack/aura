<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass Hex</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            background-color: #080808;
            background-image: 
                radial-gradient(circle at 50% 50%, #1a0000 0%, #000 100%),
                linear-gradient(rgba(255, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: white;
            overflow: hidden;
        }

        .container {
            background: rgba(15, 0, 0, 0.9);
            border: 2px solid #ff0000;
            /* Formato Hexagonal usando Clip-path */
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            padding: 80px 40px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.2);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid #ff0000;
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            pointer-events: none;
        }

        h2 {
            margin-bottom: 5px;
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 13px;
            letter-spacing: 5px;
            color: #555;
            margin-bottom: 40px;
            font-weight: 700;
        }

        /* Botão em formato de Hexágono menor */
        .install-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100px;
            height: 115px;
            background: #ff0000;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .install-btn:hover {
            transform: scale(1.1);
            background: #ffffff;
            filter: drop-shadow(0 0 20px #ff0000);
        }

        .install-btn svg {
            width: 45px;
            height: 45px;
            fill: #000;
        }

        .install-btn:hover svg {
            fill: #ff0000;
        }

        .note {
            margin-top: 40px;
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .note strong {
            color: #ff0000;
        }

        .footer {
            margin-top: 15px;
            font-size: 11px;
            color: #333;
            letter-spacing: 3px;
        }

        /* Linhas de scan animadas */
        .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(255, 0, 0, 0.2);
            top: 0;
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="scanline"></div>
        <h2>INJECTOR</h2>
        <div class="subtitle">Bypass 00</div>

        <a class="install-btn" href="freefireth:/">
            <!-- Ícone de Escudo Digital -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1ZM12 11.99H19C18.47 16.11 15.72 19.78 12 20.93V11.99H5V6.3L12 3.19V11.99Z"/>
            </svg>
        </a>

        <div class="note">
            Developed by <strong>Rugal</strong>
        </div>

        <div class="footer">
            somos 00
        </div>
    </div>
</body>
</html>
